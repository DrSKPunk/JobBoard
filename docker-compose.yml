version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobboard_db
    environment:
      POSTGRES_USER: jobboard_user
      POSTGRES_PASSWORD: jobboard_password
      POSTGRES_DB: jobboard_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: